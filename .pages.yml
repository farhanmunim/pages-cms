# Pages CMS configuration — https://pagescms.org/docs/configuration/
#
# Defines the whole CMS: collections, fields, media library, globals and the
# sidebar. Content lives as plain files in this Git repo (src/content/**),
# media in public/media/**. Astro builds the site from those files.

media:
  input: public/media
  output: /media
  rename: safe

content:
  # ---------------------------------------------------------------- Content
  - name: content
    label: Content
    type: group
    items:
      - name: pages
        label: Pages
        type: collection
        path: src/content/pages
        filename: "{primary}.md"
        view:
          primary: title
          fields: [title, status, author]
          sort: title
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: slug
            label: Slug
            type: string
            description: Optional. Overrides the slug generated from the title (the file name).
          - name: status
            label: Status
            type: select
            default: draft
            options:
              values:
                - name: draft
                  label: Draft
                - name: published
                  label: Published
          - name: author
            label: Author
            type: reference
            options:
              collection: authors
              value: "{path}"
              label: "{fields.first_name} {fields.last_name}"
          - name: cover
            label: Cover image
            type: object
            fields:
              - name: image
                label: Image
                type: image
              - name: alt
                label: Alt text
                type: string
                required: true
          - name: description
            label: Description
            type: text
            description: Used as the page's meta description.
          - name: body
            label: Content
            type: rich-text

      - name: posts
        label: Posts
        type: collection
        path: src/content/posts
        filename: "{primary}.md"
        view:
          primary: title
          fields: [title, status, date, featured, author]
          sort: date
          order: desc
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: slug
            label: Slug
            type: string
            description: Optional. Overrides the slug generated from the title (the file name).
          - name: status
            label: Status
            type: select
            default: draft
            options:
              values:
                - name: draft
                  label: Draft
                - name: published
                  label: Published
          - name: date
            label: Publish date
            type: date
            description: Set to "now" when the post is created. Editable.
            options:
              time: true
              format: yyyy-MM-dd'T'HH:mm
          - name: featured
            label: Featured
            type: boolean
            default: false
          - name: author
            label: Author
            type: reference
            options:
              collection: authors
              value: "{path}"
              label: "{fields.first_name} {fields.last_name}"
          - name: categories
            label: Categories
            type: reference
            options:
              collection: categories
              multiple: true
              value: "{path}"
              label: "{primary}"
          - name: tags
            label: Tags
            type: reference
            options:
              collection: tags
              multiple: true
              value: "{path}"
              label: "{primary}"
          - name: cover
            label: Cover image
            type: object
            fields:
              - name: image
                label: Image
                type: image
              - name: alt
                label: Alt text
                type: string
                required: true
          - name: excerpt
            label: Excerpt
            type: text
            description: Short summary for listings. Also used as the meta description.
          - name: body
            label: Content
            type: rich-text

      - name: projects
        label: Projects
        type: collection
        path: src/content/projects
        filename: "{primary}.md"
        view:
          primary: title
          fields: [title, status, featured, author]
          sort: title
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: slug
            label: Slug
            type: string
            description: Optional. Overrides the slug generated from the title (the file name).
          - name: status
            label: Status
            type: select
            default: draft
            options:
              values:
                - name: draft
                  label: Draft
                - name: published
                  label: Published
          - name: featured
            label: Featured
            type: boolean
            default: false
          - name: author
            label: Author
            type: reference
            options:
              collection: authors
              value: "{path}"
              label: "{fields.first_name} {fields.last_name}"
          - name: tags
            label: Tags
            type: reference
            options:
              collection: tags
              multiple: true
              value: "{path}"
              label: "{primary}"
          - name: cover
            label: Cover image
            type: object
            fields:
              - name: image
                label: Image
                type: image
              - name: alt
                label: Alt text
                type: string
                required: true
          - name: summary
            label: Summary
            type: text
          - name: url
            label: URL
            type: string
            description: Link to the live project.
          - name: attachment
            label: Attachment
            type: file
            description: Optional downloadable file (e.g. a case study PDF).
          - name: body
            label: Content
            type: rich-text

      - name: services
        label: Services
        type: collection
        path: src/content/services
        filename: "{primary}.md"
        view:
          primary: title
          fields: [title, status, featured, author]
          sort: title
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: slug
            label: Slug
            type: string
            description: Optional. Overrides the slug generated from the title (the file name).
          - name: status
            label: Status
            type: select
            default: draft
            options:
              values:
                - name: draft
                  label: Draft
                - name: published
                  label: Published
          - name: featured
            label: Featured
            type: boolean
            default: false
          - name: author
            label: Author
            type: reference
            options:
              collection: authors
              value: "{path}"
              label: "{fields.first_name} {fields.last_name}"
          - name: tags
            label: Tags
            type: reference
            options:
              collection: tags
              multiple: true
              value: "{path}"
              label: "{primary}"
          - name: cover
            label: Cover image
            type: object
            fields:
              - name: image
                label: Image
                type: image
              - name: alt
                label: Alt text
                type: string
                required: true
          - name: summary
            label: Summary
            type: text
          - name: body
            label: Content
            type: rich-text

      - name: resources
        label: Resources
        type: collection
        path: src/content/resources
        filename: "{primary}.md"
        view:
          primary: title
          fields: [title, status, featured, author]
          sort: title
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: slug
            label: Slug
            type: string
            description: Optional. Overrides the slug generated from the title (the file name).
          - name: status
            label: Status
            type: select
            default: draft
            options:
              values:
                - name: draft
                  label: Draft
                - name: published
                  label: Published
          - name: featured
            label: Featured
            type: boolean
            default: false
          - name: author
            label: Author
            type: reference
            options:
              collection: authors
              value: "{path}"
              label: "{fields.first_name} {fields.last_name}"
          - name: tags
            label: Tags
            type: reference
            options:
              collection: tags
              multiple: true
              value: "{path}"
              label: "{primary}"
          - name: cover
            label: Cover image
            type: object
            fields:
              - name: image
                label: Image
                type: image
              - name: alt
                label: Alt text
                type: string
                required: true
          - name: description
            label: Description
            type: text
          - name: url
            label: External URL
            type: string
            description: A resource can be an external link, a downloadable file, or both.
          - name: attachment
            label: Attachment
            type: file
            description: Optional downloadable file.
          - name: body
            label: Content
            type: rich-text

  # ----------------------------------------------------------- Organisation
  - name: organisation
    label: Organisation
    type: group
    items:
      - name: categories
        label: Categories
        type: collection
        path: src/content/categories
        filename: "{primary}.yml"
        format: yaml
        view:
          primary: name
          fields: [name, parent]
          sort: name
        fields:
          - name: name
            label: Name
            type: string
            required: true
          - name: slug
            label: Slug
            type: string
            description: Optional. Overrides the slug generated from the name (the file name).
          - name: parent
            label: Parent category
            type: reference
            description: Optional. Enables nesting (e.g. Guides → Tutorials).
            options:
              collection: categories
              value: "{path}"
              label: "{primary}"

      - name: tags
        label: Tags
        type: collection
        path: src/content/tags
        filename: "{primary}.yml"
        format: yaml
        view:
          primary: name
          fields: [name]
          sort: name
        fields:
          - name: name
            label: Name
            type: string
            required: true
          - name: slug
            label: Slug
            type: string
            description: Optional. Overrides the slug generated from the name (the file name).

  # --------------------------------------------------------------- Settings
  - name: settings
    label: Settings
    type: group
    items:
      - name: authors
        label: Authors
        type: collection
        path: src/content/authors
        filename: "{fields.first_name}-{fields.last_name}.md"
        view:
          primary: first_name
          fields: [first_name, last_name]
          sort: last_name
        fields:
          - name: first_name
            label: First name
            type: string
            required: true
          - name: last_name
            label: Last name
            type: string
            required: true
          - name: avatar
            label: Avatar
            type: image
          - name: social
            label: Social links
            type: object
            list: true
            fields:
              - name: platform
                label: Platform
                type: select
                required: true
                options:
                  values: [website, x, github, linkedin, instagram, facebook, youtube, mastodon, bluesky, other]
              - name: url
                label: URL
                type: string
                required: true
              - name: handle
                label: Handle
                type: string
          - name: body
            label: About the author
            type: rich-text

      - name: site
        label: Site settings
        type: file
        path: src/content/settings/site.yml
        format: yaml
        fields:
          - name: name
            label: Site name
            type: string
            required: true
          - name: tagline
            label: Tagline
            type: string
          - name: description
            label: Default meta description
            type: text
          - name: logo
            label: Logo
            type: image
          - name: favicon
            label: Favicon
            type: image
          - name: social_image
            label: Default social-share image
            type: image
          - name: copyright
            label: Footer copyright text
            type: string
          - name: social
            label: Social links
            type: object
            list: true
            fields:
              - name: platform
                label: Platform
                type: select
                required: true
                options:
                  values: [website, x, github, linkedin, instagram, facebook, youtube, mastodon, bluesky, other]
              - name: url
                label: URL
                type: string
                required: true
              - name: handle
                label: Handle
                type: string
          - name: head_html
            label: Head scripts (raw HTML)
            type: code
            description: Injected into the <head> of every page (analytics/tracking snippets).
            options:
              language: html
          - name: footer_html
            label: Footer scripts (raw HTML)
            type: code
            description: Injected before </body> on every page.
            options:
              language: html

      - name: permalinks
        label: Permalinks
        type: file
        path: src/content/settings/permalinks.yml
        format: yaml
        fields:
          - name: pages
            label: Pages prefix
            type: string
            description: Empty = served from the site root.
          - name: posts
            label: Posts prefix
            type: string
          - name: projects
            label: Projects prefix
            type: string
          - name: services
            label: Services prefix
            type: string
          - name: resources
            label: Resources prefix
            type: string
          - name: categories
            label: Categories prefix
            type: string
          - name: tags
            label: Tags prefix
            type: string
          - name: authors
            label: Authors prefix
            type: string
